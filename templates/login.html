<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DevSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(17, 24, 39) 90%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
        }
        .login-header {
            text-align: center;
        }
        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .form-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }
        .error-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--alert-color);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }
        .login-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            color: white;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s, transform 0.1s;
        }
        .login-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .master-badge-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .master-badge-hint span {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card glass-panel">
        <div class="login-header">
            <h1>DevSpace</h1>
            <p>Acesso Restrito Interno.<br>Digite seu e-mail cadastrado para entrar.</p>
        </div>

        <div class="error-alert" id="error-alert"></div>

        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="email">E-mail Cadastrado</label>
                <input type="email" id="email" placeholder="seu.email@cosampa.com.br" required autofocus>
            </div>
            <button type="submit" class="login-btn" id="btn-login">Entrar na Plataforma</button>
        </form>

        <div class="master-badge-hint">
            Administrador Master? <span id="fill-master-email">Usar cristian.sampaio@cosampa.com.br</span>
        </div>
    </div>

    <script>
        document.getElementById('fill-master-email').addEventListener('click', () => {
            document.getElementById('email').value = 'cristian.sampaio@cosampa.com.br';
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const errorAlert = document.getElementById('error-alert');
            const btnLogin = document.getElementById('btn-login');

            errorAlert.style.display = 'none';
            if(!email) return;

            btnLogin.disabled = true;
            btnLogin.textContent = 'Autenticando...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if(res.ok) {
                    window.location.href = '/';
                } else {
                    errorAlert.textContent = data.error || 'Erro ao realizar login.';
                    errorAlert.style.display = 'block';
                }
            } catch(err) {
                errorAlert.textContent = 'Erro de conexão com o servidor.';
                errorAlert.style.display = 'block';
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar na Plataforma';
            }
        });
    </script>
</body>
</html>
